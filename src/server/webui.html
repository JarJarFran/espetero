<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Espetero</title>
<style>
:root {
  --bg: #ffffff; --fg: #1d1f23; --muted: #6b7079; --line: #e2e4e8; --panel: #f6f7f9;
  --user: #eef3fb; --accent: #c2410c; --accent-fg: #ffffff; --code: #f3f4f6; --error: #b42318;
  --radius: 10px; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #17181b; --fg: #e6e7ea; --muted: #9a9fa8; --line: #2c2f35; --panel: #1f2125;
    --user: #22293a; --accent: #f97316; --accent-fg: #17181b; --code: #24262b; --error: #f97066;
  }
}
:root[data-theme="dark"] {
  --bg: #17181b; --fg: #e6e7ea; --muted: #9a9fa8; --line: #2c2f35; --panel: #1f2125;
  --user: #22293a; --accent: #f97316; --accent-fg: #17181b; --code: #24262b; --error: #f97066;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); display: flex; flex-direction: column;
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
}
header, footer { flex: none; padding: 10px 16px; background: var(--bg); }
header { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.brand { font-weight: 650; margin-right: auto; overflow-wrap: anywhere; }
.muted { color: var(--muted); font-weight: 400; font-size: 13px; }
button, input, textarea, select { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; cursor: pointer;
}
button:hover { border-color: var(--muted); }
button.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
.status { font-size: 13px; color: var(--accent); }
#settings {
  padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--panel); display: grid; gap: 10px;
}
#settings[hidden] { display: none; }
#settings label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
#settings .row { display: flex; gap: 16px; flex-wrap: wrap; align-items: end; }
#settings .check { display: flex; align-items: center; gap: 6px; color: var(--fg); }
input[type="number"], input[type="password"], textarea {
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%;
}
input[type="number"] { width: 10.5em; }
#log { flex: 1; overflow-y: auto; padding: 16px; }
.msg { max-width: 820px; margin: 0 auto 14px; }
.msg.user .body { background: var(--user); border-radius: var(--radius); padding: 8px 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg .who { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
.msg .body { overflow-wrap: anywhere; }
.msg .body > :first-child { margin-top: 0; }
.msg .body > :last-child { margin-bottom: 0; }
.msg .meta { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 10px; align-items: center; }
.msg .meta button { padding: 0 8px; font-size: 12px; }
.msg .error { color: var(--error); white-space: pre-wrap; }
.msg .thumbs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.msg img.thumb { max-height: 160px; max-width: 100%; border-radius: 8px; display: block; }
details.thinking { color: var(--muted); border-left: 3px solid var(--line); padding: 2px 10px; margin-bottom: 8px; }
details.thinking summary { cursor: pointer; font-size: 13px; }
details.thinking div { white-space: pre-wrap; font-size: 13.5px; }
pre { background: var(--code); border-radius: 8px; padding: 10px 12px; overflow-x: auto; position: relative; }
pre button { position: absolute; top: 6px; right: 6px; padding: 0 8px; font-size: 12px; }
code { font-family: var(--mono); font-size: 13px; background: var(--code); border-radius: 4px; padding: 1px 4px; }
pre code { background: none; padding: 0; }
blockquote { margin: 8px 0; padding-left: 12px; border-left: 3px solid var(--line); color: var(--muted); }
table { border-collapse: collapse; display: block; overflow-x: auto; }
th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
a { color: var(--accent); }
footer { border-top: 1px solid var(--line); }
#form { display: flex; gap: 8px; align-items: end; max-width: 820px; margin: 0 auto; }
#input { resize: none; max-height: 40vh; min-height: 40px; }
.attach { cursor: pointer; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); user-select: none; }
#attachments { max-width: 820px; margin: 0 auto; display: flex; gap: 8px; flex-wrap: wrap; }
#attachments:not(:empty) { margin-bottom: 8px; }
#attachments figure { margin: 0; position: relative; }
#attachments img { height: 56px; border-radius: 6px; display: block; }
#attachments button { position: absolute; top: -6px; right: -6px; padding: 0 6px; font-size: 12px; border-radius: 10px; }
#stats { max-width: 820px; margin: 6px auto 0; min-height: 1em; }
.empty { max-width: 820px; margin: 15vh auto 0; text-align: center; color: var(--muted); }
@media (max-width: 600px) { header, footer, #log { padding-left: 16px; padding-right: 16px; } #send, #stop { padding: 6px 10px; } }
</style>
</head>
<body>
<header>
  <div class="brand">Espetero <span id="model" class="muted"></span></div>
  <span id="status" class="status" role="status"></span>
  <button id="new" type="button">New chat</button>
  <button id="settings-button" type="button" aria-controls="settings" aria-expanded="false">Settings</button>
  <button id="theme" type="button" aria-label="Switch light or dark">◐</button>
</header>
<section id="settings" hidden>
  <label>System prompt <textarea id="system" rows="3" placeholder="Optional"></textarea></label>
  <div class="row">
    <label>Temperature <input id="temperature" type="number" min="0" max="2" step="0.05" placeholder="model default"></label>
    <label>Max tokens <input id="max-tokens" type="number" min="1" step="1" placeholder="4096"></label>
    <label class="check"><input id="think" type="checkbox" checked> Thinking</label>
  </div>
  <label>API key (kept in this browser) <input id="key" type="password" autocomplete="off" placeholder="Only when the server has one"></label>
</section>
<main id="log" aria-live="polite"><p class="empty" id="empty">Ask anything. Paste or attach images to ask about them.</p></main>
<footer>
  <div id="attachments"></div>
  <form id="form">
    <label class="attach" title="Attach images">+<input id="file" type="file" accept="image/*" multiple hidden></label>
    <textarea id="input" rows="1" placeholder="Message (Enter sends, Shift+Enter for a new line)"></textarea>
    <button id="send" class="primary" type="submit">Send</button>
    <button id="stop" type="button" hidden>Stop</button>
  </form>
  <div id="stats" class="muted"></div>
</footer>
<script>
"use strict";
// Espetero's web chat: talks to this server's /v1/chat/completions
// (same origin). Model and user text are only ever set as text nodes.
const $ = (id) => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("espetero." + k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("espetero." + k, v); } catch (e) { /* full or blocked: kept for this page only */ } },
};
const state = { messages: [], images: [], abort: null, ready: false };

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// ---- settings, kept in localStorage
for (const id of ["system", "temperature", "max-tokens", "key"]) {
  const input = $(id);
  input.value = store.get(id, "");
  input.addEventListener("change", () => { store.set(id, input.value); if (id === "key" && !state.ready) poll(); });
}
$("think").checked = store.get("think", "1") === "1";
$("think").addEventListener("change", () => store.set("think", $("think").checked ? "1" : "0"));
const savedTheme = store.get("theme", "");
if (savedTheme) document.documentElement.dataset.theme = savedTheme;
$("theme").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme
    ? document.documentElement.dataset.theme === "dark"
    : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark";
  store.set("theme", document.documentElement.dataset.theme);
});
function toggleSettings(open) {
  const s = $("settings");
  s.hidden = open === undefined ? !s.hidden : !open;
  $("settings-button").setAttribute("aria-expanded", String(!s.hidden));
}
$("settings-button").addEventListener("click", () => toggleSettings());

function headers() {
  const h = { "Content-Type": "application/json" };
  const key = $("key").value.trim();
  if (key) h.Authorization = "Bearer " + key;
  return h;
}
function setStatus(text) { $("status").textContent = text; }

// ---- readiness: /health answers 503 while the model loads, 401 without the key
async function poll() {
  clearTimeout(poll.timer);
  try {
    const r = await fetch("/health", { headers: headers(), cache: "no-store" });
    if (r.ok) {
      const j = await r.json();
      state.ready = true;
      $("model").textContent = j.model || "";
      setStatus("");
      updateControls();
      return;
    }
    if (r.status === 401) { setStatus("This server needs its API key (Settings)."); toggleSettings(true); }
    else if (r.status === 503) setStatus("Loading the model…");
    else setStatus("The server answered " + r.status + ".");
  } catch (e) {
    setStatus("Cannot reach the server.");
  }
  state.ready = false;
  updateControls();
  poll.timer = setTimeout(poll, 1500);
}

function updateControls() {
  const busy = !!state.abort;
  $("send").hidden = busy;
  $("stop").hidden = !busy;
  $("send").disabled = !state.ready;
}

// ---- markdown: a small subset, built as DOM nodes (never parsed as HTML)
const INLINE = /(`+)([\s\S]*?[^`])\1(?!`)|\*\*(?=\S)([\s\S]*?\S)\*\*|__(?=\S)([\s\S]*?\S)__|\*(?=[^\s*])([\s\S]*?[^\s*])\*|(?<![\w])_(?=\S)([\s\S]*?\S)_(?![\w])|\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g;
function inline(text, parent) {
  let last = 0;
  const plain = (s) => {
    const parts = s.split("\n");
    parts.forEach((p, i) => { if (i) parent.appendChild(el("br")); if (p) parent.appendChild(document.createTextNode(p)); });
  };
  for (const m of text.matchAll(INLINE)) {
    plain(text.slice(last, m.index));
    last = m.index + m[0].length;
    if (m[1]) parent.appendChild(el("code", "", m[2].replace(/^ (.*) $/, "$1")));
    else if (m[3] !== undefined || m[4] !== undefined) inline(m[3] !== undefined ? m[3] : m[4], parent.appendChild(el("strong")));
    else if (m[5] !== undefined || m[6] !== undefined) inline(m[5] !== undefined ? m[5] : m[6], parent.appendChild(el("em")));
    else {
      const a = el("a");
      a.href = m[8];
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      inline(m[7], a);
      parent.appendChild(a);
    }
  }
  plain(text.slice(last));
}
const cells = (line) => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map((c) => c.trim());
function markdown(text, parent) {
  const lines = text.split("\n");
  for (let i = 0; i < lines.length;) {
    const line = lines[i];
    const fence = line.match(/^\s*(`{3,}|~{3,})\s*([\w+#.-]*)/);
    if (fence) {
      const body = [];
      for (++i; i < lines.length && !lines[i].trim().startsWith(fence[1]); ++i) body.push(lines[i]);
      ++i;
      const pre = el("pre");
      const code = el("code", "", body.join("\n"));
      pre.appendChild(code);
      if (navigator.clipboard) {
        const b = el("button", "", "copy");
        b.type = "button";
        b.addEventListener("click", () => navigator.clipboard.writeText(code.textContent));
        pre.appendChild(b);
      }
      parent.appendChild(pre);
      continue;
    }
    if (!line.trim()) { ++i; continue; }
    const h = line.match(/^(#{1,6})\s+(.*)$/);
    if (h) { inline(h[2], parent.appendChild(el("h" + h[1].length))); ++i; continue; }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { parent.appendChild(el("hr")); ++i; continue; }
    if (/^\s*>/.test(line)) {
      const body = [];
      for (; i < lines.length && /^\s*>/.test(lines[i]); ++i) body.push(lines[i].replace(/^\s*> ?/, ""));
      markdown(body.join("\n"), parent.appendChild(el("blockquote")));
      continue;
    }
    if (line.includes("|") && i + 1 < lines.length && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[i + 1]) &&
        cells(line).length === cells(lines[i + 1]).length) {
      const table = el("table");
      const tr = table.appendChild(el("thead")).appendChild(el("tr"));
      for (const c of cells(line)) inline(c, tr.appendChild(el("th")));
      const tbody = table.appendChild(el("tbody"));
      for (i += 2; i < lines.length && lines[i].includes("|") && lines[i].trim(); ++i) {
        const row = tbody.appendChild(el("tr"));
        for (const c of cells(lines[i])) inline(c, row.appendChild(el("td")));
      }
      parent.appendChild(table);
      continue;
    }
    const item = /^(\s*)([-*+]|\d{1,9}[.)])\s+(.*)$/;
    let li = line.match(item);
    if (li) {
      const list = el(/\d/.test(li[2]) ? "ol" : "ul");
      if (list.tagName === "OL" && parseInt(li[2], 10) !== 1) list.start = parseInt(li[2], 10);
      while (i < lines.length && (li = lines[i].match(item))) {
        const text = [li[3]];
        for (++i; i < lines.length && /^\s{2,}\S/.test(lines[i]) && !item.test(lines[i]); ++i) text.push(lines[i].trim());
        inline(text.join("\n"), list.appendChild(el("li")));
      }
      parent.appendChild(list);
      continue;
    }
    const para = [];
    for (; i < lines.length && lines[i].trim() && !/^\s*(`{3,}|~{3,}|#{1,6}\s|>)/.test(lines[i]) && !item.test(lines[i]); ++i)
      para.push(lines[i]);
    if (!para.length) para.push(lines[i++]);
    inline(para.join("\n"), parent.appendChild(el("p")));
  }
}

// ---- messages
function scrollDown() { const log = $("log"); log.scrollTop = log.scrollHeight; }
function view(m) {
  $("empty").hidden = true;
  const box = el("article", "msg " + m.role);
  box.appendChild(el("div", "who", m.role === "user" ? "You" : $("model").textContent || "Assistant"));
  const parts = { box };
  if (m.role === "assistant") {
    parts.thinking = el("details", "thinking");
    parts.thinking.appendChild(el("summary", "", "Thinking"));
    parts.thinkText = parts.thinking.appendChild(el("div"));
    parts.thinking.hidden = true;
    box.appendChild(parts.thinking);
  }
  parts.body = box.appendChild(el("div", "body"));
  parts.meta = box.appendChild(el("div", "meta"));
  $("log").appendChild(box);
  render(m, parts);
  return parts;
}
function render(m, parts) {
  if (m.role === "user") {
    parts.body.replaceChildren();
    if (m.images && m.images.length) {
      const row = parts.body.appendChild(el("div", "thumbs"));
      for (const url of m.images) {
        const img = row.appendChild(el("img", "thumb"));
        img.src = url;
        img.alt = "attached image";
      }
    }
    parts.body.appendChild(document.createTextNode(m.text));
    return;
  }
  if (m.reasoning) {
    parts.thinking.hidden = false;
    parts.thinkText.textContent = m.reasoning;
  }
  parts.body.replaceChildren();
  markdown(m.text || "", parts.body);
  if (m.error) parts.body.appendChild(el("div", "error", m.error));
}
function addCopy(m, parts) {
  if (!navigator.clipboard || !m.text) return;
  const b = el("button", "", "Copy");
  b.type = "button";
  b.addEventListener("click", () => navigator.clipboard.writeText(m.text));
  parts.meta.appendChild(b);
}
function save() {
  try { localStorage.setItem("espetero.chat", JSON.stringify(state.messages)); }
  catch (e) { try { localStorage.removeItem("espetero.chat"); } catch (e2) { /* blocked */ } }
}
function restore() {
  try { state.messages = JSON.parse(localStorage.getItem("espetero.chat") || "[]"); } catch (e) { state.messages = []; }
  if (!Array.isArray(state.messages)) state.messages = [];
  for (const m of state.messages) { const p = view(m); if (m.role === "assistant") { addCopy(m, p); if (m.stats) p.meta.prepend(el("span", "", m.stats)); } }
  scrollDown();
}

// The chat route's messages: images first, then the question.
function wire(m) {
  if (m.role !== "user" || !(m.images && m.images.length)) return { role: m.role, content: m.text };
  const content = m.images.map((url) => ({ type: "image_url", image_url: { url } }));
  if (m.text) content.push({ type: "text", text: m.text });
  return { role: "user", content };
}

async function send() {
  const text = $("input").value.trim();
  if (state.abort || !state.ready || (!text && !state.images.length)) return;
  const user = { role: "user", text, images: state.images.slice() };
  state.messages.push(user);
  view(user);
  $("input").value = "";
  state.images = [];
  showAttachments();
  autosize();
  const reply = { role: "assistant", text: "", reasoning: "" };
  state.messages.push(reply);
  const parts = view(reply);
  scrollDown();

  const body = { messages: [], stream: true, stream_options: { include_usage: true }, enable_thinking: $("think").checked };
  const sys = $("system").value.trim();
  if (sys) body.messages.push({ role: "system", content: sys });
  for (const m of state.messages.slice(0, -1)) body.messages.push(wire(m));
  const t = parseFloat($("temperature").value);
  if (!Number.isNaN(t)) body.temperature = t;
  const mt = parseInt($("max-tokens").value, 10);
  body.max_tokens = mt > 0 ? mt : 4096;

  state.abort = new AbortController();
  updateControls();
  const t0 = performance.now();
  let tFirst = 0, usage = null, finish = "", pending = false;
  const paint = () => {
    if (pending) return;
    pending = true;
    requestAnimationFrame(() => {
      pending = false;
      const log = $("log");
      const atEnd = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
      render(reply, parts);
      if (atEnd) scrollDown();
    });
  };
  try {
    const r = await fetch("/v1/chat/completions", { method: "POST", headers: headers(), body: JSON.stringify(body), signal: state.abort.signal });
    if (!r.ok) {
      let msg = "HTTP " + r.status;
      try { const j = await r.json(); msg = (j.error && (j.error.message || j.error)) || j.detail || msg; } catch (e) { /* not JSON */ }
      if (r.status === 401) toggleSettings(true);
      throw new Error(msg);
    }
    const reader = r.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    const event = (raw) => {
      const data = raw.split("\n").filter((l) => l.startsWith("data:")).map((l) => l.slice(5).replace(/^ /, "")).join("\n");
      if (!data || data === "[DONE]") return;
      const j = JSON.parse(data);
      if (j.error) throw new Error(j.error.message || String(j.error));
      if (j.usage) usage = j.usage;
      const c = j.choices && j.choices[0];
      if (!c) return;
      const d = c.delta || {};
      if (d.reasoning_content || d.content) {
        if (!tFirst) tFirst = performance.now();
        reply.reasoning += d.reasoning_content || "";
        reply.text += d.content || "";
        paint();
      }
      if (d.tool_calls) for (const call of d.tool_calls) reply.text += "\n\n`" + ((call.function && call.function.name) || "tool") + "(" + ((call.function && call.function.arguments) || "") + ")`";
      if (c.finish_reason) finish = c.finish_reason;
    };
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      for (let k; (k = buf.indexOf("\n\n")) >= 0; buf = buf.slice(k + 2)) event(buf.slice(0, k));
    }
    if (finish === "length") reply.error = "(cut at max tokens)";
  } catch (e) {
    reply.error = e.name === "AbortError" ? "(stopped)" : String(e.message || e);
  }
  const t1 = performance.now();
  const n = usage ? usage.completion_tokens : 0;
  const stats = [];
  if (n) stats.push(n + " tokens");
  if (n > 1 && tFirst && t1 > tFirst) stats.push(((n - 1) / ((t1 - tFirst) / 1000)).toFixed(1) + " tokens/s");
  if (tFirst) stats.push("first token " + ((tFirst - t0) / 1000).toFixed(2) + " s");
  reply.stats = stats.join(" · ");
  $("stats").textContent = reply.stats;
  render(reply, parts);
  parts.meta.appendChild(el("span", "", reply.stats));
  addCopy(reply, parts);
  state.abort = null;
  updateControls();
  save();
}

// ---- images: paste, drop or the + button, sent as data URLs
function addImages(files) {
  for (const f of files) {
    if (!f.type.startsWith("image/") || state.images.length >= 32) continue;
    const rd = new FileReader();
    rd.onload = () => { state.images.push(rd.result); showAttachments(); };
    rd.readAsDataURL(f);
  }
}
function showAttachments() {
  const box = $("attachments");
  box.replaceChildren();
  state.images.forEach((url, i) => {
    const fig = box.appendChild(el("figure"));
    const img = fig.appendChild(el("img"));
    img.src = url;
    img.alt = "image " + (i + 1);
    const x = fig.appendChild(el("button", "", "×"));
    x.type = "button";
    x.setAttribute("aria-label", "Remove image " + (i + 1));
    x.addEventListener("click", () => { state.images.splice(i, 1); showAttachments(); });
  });
}
$("file").addEventListener("change", (e) => { addImages(e.target.files); e.target.value = ""; });
document.addEventListener("paste", (e) => {
  const files = [...(e.clipboardData ? e.clipboardData.files : [])].filter((f) => f.type.startsWith("image/"));
  if (files.length) { e.preventDefault(); addImages(files); }
});
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", (e) => { e.preventDefault(); addImages(e.dataTransfer ? e.dataTransfer.files : []); });

// ---- input
function autosize() { const t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, innerHeight * 0.4) + "px"; }
$("input").addEventListener("input", autosize);
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(); }
});
$("form").addEventListener("submit", (e) => { e.preventDefault(); send(); });
$("stop").addEventListener("click", () => { if (state.abort) state.abort.abort(); });
$("new").addEventListener("click", () => {
  if (state.abort) state.abort.abort();
  state.messages = [];
  save();
  $("log").replaceChildren($("empty"));
  $("empty").hidden = false;
  $("stats").textContent = "";
  $("input").focus();
});

restore();
updateControls();
poll();
$("input").focus();
</script>
</body>
</html>
